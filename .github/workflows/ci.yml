name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Format, audit, build, and test
        shell: pwsh
        run: ./eng/Verify.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn

  package:
    name: Package / ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
            binary: bantz-v*-win-x64.exe
            archive: bantz-v*-win-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            platform: linux-x64
            binary: bantz-v*-linux-x64
            archive: bantz-v*-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Publish and smoke test
        shell: pwsh
        run: ./eng/Package.ps1 -Platform '${{ matrix.platform }}'
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            artifacts/release/${{ matrix.binary }}
            artifacts/release/${{ matrix.binary }}.sha256
            artifacts/release/${{ matrix.archive }}
            artifacts/release/${{ matrix.archive }}.sha256
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
