name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  verify:
    name: Verify version and quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Require tag to match project version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Bantz.App/Bantz.App.csproj -getProperty:Version).Trim()
          if (-not $version) { throw 'Could not read the project version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match project version 'v$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run release gates
        shell: pwsh
        env:
          CUPRIFACE_GITHUB_USER: ${{ github.actor }}
          CUPRIFACE_GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/Verify.ps1
      - name: Pack libraries and run package-consumer smoke test
        shell: pwsh
        run: ./eng/PackLibraries.ps1
      - name: Upload library packages
        uses: actions/upload-artifact@v7
        with:
          name: library-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package / ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
            binary: bantz-v*-win-x64.exe
            archive: bantz-v*-win-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            platform: linux-x64
            binary: bantz-v*-linux-x64
            archive: bantz-v*-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Publish and smoke test
        shell: pwsh
        env:
          CUPRIFACE_GITHUB_USER: ${{ github.actor }}
          CUPRIFACE_GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/Package.ps1 -Platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            artifacts/release/${{ matrix.binary }}
            artifacts/release/${{ matrix.binary }}.sha256
            artifacts/release/${{ matrix.archive }}
            artifacts/release/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release and packages
    if: github.ref_type == 'tag'
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts/download
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: library-packages
          path: artifacts/download
      - name: Publish NuGet packages
        shell: pwsh
        env:
          PACKAGE_SOURCE: https://nuget.pkg.github.com/Wixely/index.json
        run: |
          $packages = Get-ChildItem artifacts/download -File -Filter '*.nupkg' |
            Where-Object { $_.Name -notlike '*.snupkg' } |
            Sort-Object Name
          if ($packages.Count -ne 4) { throw "Expected four library packages; found $($packages.Count)." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source $env:PACKAGE_SOURCE --api-key '${{ github.token }}' --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $($package.Name) failed." }
          }
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $files = Get-ChildItem artifacts/download -File |
            Where-Object { $_.Name -like "bantz-v$env:VERSION-*" } |
            Sort-Object Name
          if ($files.Count -ne 8) { throw "Expected eight release files; found $($files.Count)." }
          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--generate-notes',
            '--title', "Bantz $env:GITHUB_REF_NAME"
          )
          $arguments += $files.FullName
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
      # The packages and release assets now live in permanent GitHub storage, so the Actions
      # artifacts are duplicate copies. Keep them when publication fails so a rerun can reuse them.
      - name: Delete this run's artifacts after publication
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts" `
            --jq '.artifacts[] | [.id, .name] | @tsv'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list release workflow artifacts.' }

          foreach ($artifact in $artifacts) {
            $id, $name = $artifact -split "`t", 2
            Write-Host "Deleting $name ($id)"
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
            if ($LASTEXITCODE -ne 0) { throw "Could not delete artifact '$name' ($id)." }
          }
