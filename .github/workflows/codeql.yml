name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Authenticate the CupriFace package feed
        shell: pwsh
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username '${{ github.actor }}'
          --password '${{ github.token }}'
          --store-password-in-clear-text
          --configfile NuGet.config
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Restore
        run: dotnet restore Bantz.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build
        run: dotnet build Bantz.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@v4
